name: APK bauen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android-Lizenzen akzeptieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk GlasDashboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GlasDashboard-APK
          path: GlasDashboard.apk
      - name: Als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Glas-Dashboard (neueste Version)
          body: Auf dem Handy GlasDashboard.apk antippen und installieren.
          files: GlasDashboard.apk
          make_latest: true
